<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RS TOURNAMENT — Admin Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07090f;
      --bg-card: #0e111a;
      --surface-border: rgba(255, 215, 0, 0.15);
      --neon-gold: #ffd700;
      --neon-orange: #ff9800;
      --neon-cyan: #00e5ff;
      --neon-red: #ff1744;
      --neon-green: #00e676;
      --text-main: #f5f5f5;
      --text-secondary: #a0aab8;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-border);
    }
    .brand {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 800;
      color: var(--neon-gold);
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--neon-gold), var(--neon-orange)); color: #000; }
    .btn-secondary { background: rgba(255,215,0,0.1); color: var(--neon-gold); border: 1px solid rgba(255,215,0,0.3); }
    .input-group { margin-bottom: 12px; }
    .input-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
    .form-input {
      width: 100%;
      height: 42px;
      background: #04060a;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 0 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1a1f2c;
      border: 1px solid var(--neon-gold);
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 13px;
      z-index: 2000;
      transition: transform 0.3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="brand">RS TOURNAMENT — ADMIN PANEL</div>
    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 11px;" onclick="adminLogout()">Logout</button>
  </header>

  <div class="card" style="background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(0,229,255,0.05));">
    <h3 style="font-family: var(--font-heading); font-size: 16px; color: var(--neon-gold); margin-bottom: 6px;">Full Map Custom Clash Squad Control</h3>
    <p style="font-size: 12px; color: var(--text-secondary);">Manage verified admin matches, review top-up requests, and monitor audit ledgers.</p>
  </div>

  <div class="card">
    <h3 style="font-family: var(--font-heading); font-size: 15px; color: #fff; margin-bottom: 10px;">Pending Top-Up Verification</h3>
    <div id="adminTopupContainer">
      <div style="font-size:12px; color:var(--text-secondary);">No pending top-up requests.</div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-family: var(--font-heading); font-size: 15px; color: #fff; margin-bottom: 10px;">System Settings & Entry Fee Limits</h3>
    <div class="input-group">
      <label class="input-label">Default Winner Prize Bonus (%)</label>
      <input type="number" class="form-input" value="70" readonly>
    </div>
    <div class="input-group">
      <label class="input-label">Max Allowed Entry Fee (Coins)</label>
      <input type="number" class="form-input" value="500">
    </div>
    <button class="btn btn-primary" onclick="showToast('Admin settings saved successfully!')">Save Settings</button>
  </div>

  <div class="toast" id="adminToast">Action successful</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById("adminToast");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function adminLogout() {
      showToast("Admin logged out");
      setTimeout(() => location.href = "index.html", 1000);
    }
  </script>
</body>
</html>
